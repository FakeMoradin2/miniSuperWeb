<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/styles_login.css">
</head>
<body>
    <div class="container">
        <div class="corner-image" aria-hidden="true">
            <a href="principal.html">
                <img src="../WhatsApp Image 2025-10-12 at 12.46.25_976f73b5.jpg" alt="Imagen de esquina">
            </a> 
        </div>  

        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to your account to continue shopping</p>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>

                <div class="show-password">
                    <input type="checkbox" id="showPassword">
                    <label for="showPassword">Show Password</label>
                </div>
            </div>
            
            <div class="forgot-password">
                <a href="#" id="forgotPassword">Forgot your password?</a>
            </div>
            
            <button type="submit" class="signin-btn" id="loginButton">
                <span class="button-text">Login</span>
                <span class="button-loading" style="display: none;">Loading...</span>
            </button>
            
            <div class="signup">Don't have an account? <a href="signup.html">Sign up</a></div>
        </form>

        <!-- Mensaje de error -->
        <div id="errorMessage" class="error-message" style="display: none;"></div>
    </div>

    <script>
        (function() {
            const form = document.getElementById('loginForm');
            const toggle = document.getElementById('showPassword');
            const pwd = document.getElementById('password');
            const loginButton = document.getElementById('loginButton');
            const errorMessage = document.getElementById('errorMessage');

            // Función para mostrar mensaje de error
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 5000);
            }

            // Función para mostrar/ocultar loading
            function setLoading(isLoading) {
                const buttonText = loginButton.querySelector('.button-text');
                const buttonLoading = loginButton.querySelector('.button-loading');
                
                if (isLoading) {
                    buttonText.style.display = 'none';
                    buttonLoading.style.display = 'inline';
                    loginButton.disabled = true;
                } else {
                    buttonText.style.display = 'inline';
                    buttonLoading.style.display = 'none';
                    loginButton.disabled = false;
                }
            }

            // Toggle para mostrar contraseña
            if (toggle && pwd) {
                toggle.addEventListener('change', function() {
                    pwd.type = this.checked ? 'text' : 'password';
                });
            }

            // Manejo del formulario de login
            if (!form) return;
            
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const username = form.username.value.trim();
                const password = form.password.value;

                // Validaciones básicas
                if (!username || !password) {
                    showError('Please complete all fields.');
                    return;
                }

                if (password.length < 8) {
                    showError('Password must be at least 8 characters.');
                    return;
                }

                try {
                    setLoading(true);
                    
                    // SIMULACIÓN DE LOGIN - SIN DEPENDER DEL BACKEND
                    console.log('🔐 Attempting login with:', { username, password });
                    
                    // Simular delay de red
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    
                    // Verificar si el usuario existe en localStorage (de registro previo)
                    const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
                    const userExists = registeredUsers.some(user => 
                        user.nombre_usuario === username && user.password === password
                    );

                    if (userExists || (username && password.length >= 8)) {
                        // Login exitoso - simular respuesta
                        const userData = {
                            id: Date.now(),
                            name: username,
                            username: username,
                            role: 'cliente', // Por defecto para usuarios nuevos
                            token: 'simulated_token_' + Date.now()
                        };
                        
                        localStorage.setItem('user', JSON.stringify(userData));
                        localStorage.setItem('isLoggedIn', 'true');
                        
                        console.log('✅ Login successful:', userData);
                        
                        // Redirigir a la página principal
                        window.location.href = 'principal.html';
                        
                    } else {
                        showError('Invalid username or password. Please try again or sign up.');
                    }
                    
                } catch (error) {
                    console.error('❌ Login error:', error);
                    showError('Login error. Please try again later.');
                } finally {
                    setLoading(false);
                }
            });

            // Olvidó contraseña
            const forgotPassword = document.getElementById('forgotPassword');
            if (forgotPassword) {
                forgotPassword.addEventListener('click', function(e) {
                    e.preventDefault();
                    showError('Password recovery feature coming soon.');
                });
            }

            // Verificar si hay usuarios registrados en localStorage (para testing)
            window.checkRegisteredUsers = function() {
                const users = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
                console.log('📋 Registered users:', users);
                return users;
            };

            // Para debugging: mostrar usuarios registrados en consola
            console.log('👥 Currently registered users:', window.checkRegisteredUsers());

        })();
    </script>
</body>
</html>
