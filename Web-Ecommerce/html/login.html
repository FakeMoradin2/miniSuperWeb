<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/styles_login.css">
</head>
<body>
    <div class="container">
        <div class="corner-image" aria-hidden="true">
            <a href="principal.html">
                <img src="../WhatsApp Image 2025-10-12 at 12.46.25_976f73b5.jpg" alt="Imagen de esquina">
            </a> 
        </div>  

        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to your account to continue shopping</p>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>

                <div class="show-password">
                    <input type="checkbox" id="showPassword">
                    <label for="showPassword">Show Password</label>
                </div>
            </div>
            
            <div class="forgot-password">
                <a href="#" id="forgotPassword">Forgot your password?</a>
            </div>
            
            <button type="submit" class="signin-btn" id="loginButton">
                <span class="button-text">Login</span>
                <span class="button-loading" style="display: none;">Loading...</span>
            </button>
            
            <div class="signup">Don't have an account? <a href="signup.html">Sign up</a></div>
        </form>

        <!-- Mensaje de error -->
        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <!-- Información de usuarios de prueba -->
        <div class="test-users-info" style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px; font-size: 12px; color: #666;">
            <strong>Usuarios de prueba:</strong><br>
            • Admin: admin01 / password123<br>
            • Cajero: cajero01 / password123<br>
            • Cliente: cliente01 / password123
        </div>
    </div>

    <!-- Incluir el AuthManager -->
    <script src="../jss/auth.js"></script>

    <script>
        (function() {
            // Crear usuarios de prueba para testing
            const testUsers = [
                { nombre_usuario: 'admin01', password: 'password123', role: 'admin', name: 'Administrador Principal' },
                { nombre_usuario: 'cajero01', password: 'password123', role: 'cajero', name: 'Cajero Principal' },
                { nombre_usuario: 'cliente01', password: 'password123', role: 'cliente', name: 'Cliente Ejemplo' }
            ];

            // Guardar usuarios de prueba en localStorage si no existen
            if (!localStorage.getItem('registeredUsers')) {
                localStorage.setItem('registeredUsers', JSON.stringify(testUsers));
                console.log('✅ Usuarios de prueba creados:', testUsers);
            }

            const form = document.getElementById('loginForm');
            const toggle = document.getElementById('showPassword');
            const pwd = document.getElementById('password');
            const loginButton = document.getElementById('loginButton');
            const errorMessage = document.getElementById('errorMessage');

            // Función para mostrar mensaje de error
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 5000);
            }

            // Función para mostrar/ocultar loading
            function setLoading(isLoading) {
                const buttonText = loginButton.querySelector('.button-text');
                const buttonLoading = loginButton.querySelector('.button-loading');
                
                if (isLoading) {
                    buttonText.style.display = 'none';
                    buttonLoading.style.display = 'inline';
                    loginButton.disabled = true;
                } else {
                    buttonText.style.display = 'inline';
                    buttonLoading.style.display = 'none';
                    loginButton.disabled = false;
                }
            }

            // Toggle para mostrar contraseña
            if (toggle && pwd) {
                toggle.addEventListener('change', function() {
                    pwd.type = this.checked ? 'text' : 'password';
                });
            }

            // Función para determinar el rol basado en el usuario
            function determineUserRole(username, registeredUsers) {
                // Buscar en usuarios registrados
                const registeredUser = registeredUsers.find(user => 
                    user.nombre_usuario === username
                );
                
                if (registeredUser) {
                    return registeredUser.role;
                }
                
                // Si no está registrado, determinar por el nombre de usuario
                const usernameLower = username.toLowerCase();
                if (usernameLower.includes('admin')) {
                    return 'admin';
                } else if (usernameLower.includes('cajero') || usernameLower.includes('cashier')) {
                    return 'cajero';
                } else {
                    return 'cliente';
                }
            }

            // Función para obtener datos del usuario
            function getUserData(username, role, registeredUsers) {
                const registeredUser = registeredUsers.find(user => 
                    user.nombre_usuario === username
                );
                
                if (registeredUser) {
                    return {
                        id: Date.now(),
                        name: registeredUser.name || username,
                        username: username,
                        role: role,
                        email: `${username}@minisuper.com`,
                        token: 'simulated_token_' + Date.now()
                    };
                }
                
                // Usuario no registrado (login básico)
                return {
                    id: Date.now(),
                    name: username,
                    username: username,
                    role: role,
                    email: `${username}@minisuper.com`,
                    token: 'simulated_token_' + Date.now()
                };
            }

            // Manejo del formulario de login
            if (!form) return;
            
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const username = form.username.value.trim();
                const password = form.password.value;

                // Validaciones básicas
                if (!username || !password) {
                    showError('Please complete all fields.');
                    return;
                }

                if (password.length < 8) {
                    showError('Password must be at least 8 characters.');
                    return;
                }

                try {
                    setLoading(true);
                    
                    // SIMULACIÓN DE LOGIN - SIN DEPENDER DEL BACKEND
                    console.log('🔐 Attempting login with:', { username, password });
                    
                    // Simular delay de red
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    
                    // Verificar si el usuario existe en localStorage (de registro previo)
                    const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
                    const userExists = registeredUsers.some(user => 
                        user.nombre_usuario === username && user.password === password
                    );

                    // Permitir login también con cualquier usuario que cumpla requisitos básicos
                    if (userExists || (username && password.length >= 8)) {
                        // Determinar el rol del usuario
                        const userRole = determineUserRole(username, registeredUsers);
                        
                        // Obtener datos del usuario
                        const userData = getUserData(username, userRole, registeredUsers);
                        
                        // Usar el AuthManager para el login
                        const loginSuccess = window.authManager.login(userData);
                        
                        if (loginSuccess) {
                            console.log('✅ Login successful:', userData);
                            console.log('🎯 User role:', userRole);
                            
                            // Redirigir según el rol usando el AuthManager
                            window.authManager.redirectByRole(userRole);
                        } else {
                            showError('Error during login process. Please try again.');
                        }
                        
                    } else {
                        showError('Invalid username or password. Please try again or sign up.');
                    }
                    
                } catch (error) {
                    console.error('❌ Login error:', error);
                    showError('Login error. Please try again later.');
                } finally {
                    setLoading(false);
                }
            });

            // Olvidó contraseña
            const forgotPassword = document.getElementById('forgotPassword');
            if (forgotPassword) {
                forgotPassword.addEventListener('click', function(e) {
                    e.preventDefault();
                    showError('Password recovery feature coming soon.');
                });
            }

            // Verificar si hay usuarios registrados en localStorage (para testing)
            window.checkRegisteredUsers = function() {
                const users = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
                console.log('📋 Registered users:', users);
                return users;
            };

            // Verificar si ya está autenticado y redirigir
            function checkExistingAuth() {
                if (window.authManager && window.authManager.checkAuthentication()) {
                    const user = window.authManager.getUser();
                    console.log('🔐 User already authenticated:', user);
                    
                    // Mostrar mensaje informativo
                    const alreadyLoggedIn = document.createElement('div');
                    alreadyLoggedIn.className = 'info-message';
                    alreadyLoggedIn.style.cssText = `
                        background: #d4edda;
                        color: #155724;
                        padding: 12px;
                        border-radius: 5px;
                        margin: 10px 0;
                        text-align: center;
                    `;
                    alreadyLoggedIn.innerHTML = `
                        Ya estás autenticado como <strong>${user.name}</strong> (${user.role}). 
                        <br><a href="#" id="continueAsUser">Continuar como ${user.name}</a> | 
                        <a href="#" id="logoutAndLogin">Cerrar sesión y entrar como otro usuario</a>
                    `;
                    
                    form.parentNode.insertBefore(alreadyLoggedIn, form);
                    
                    // Event listeners para los enlaces
                    document.getElementById('continueAsUser').addEventListener('click', function(e) {
                        e.preventDefault();
                        window.authManager.redirectByRole(user.role);
                    });
                    
                    document.getElementById('logoutAndLogin').addEventListener('click', function(e) {
                        e.preventDefault();
                        window.authManager.logout();
                    });
                }
            }

            // Ejecutar verificación de autenticación existente cuando el AuthManager esté listo
            if (window.authManager) {
                setTimeout(checkExistingAuth, 100);
            } else {
                window.addEventListener('load', checkExistingAuth);
            }

            // Para debugging: mostrar usuarios registrados en consola
            console.log('👥 Currently registered users:', window.checkRegisteredUsers());

        })();
    </script>

    <style>
        .info-message a {
            color: #155724;
            text-decoration: underline;
            margin: 0 5px;
        }
        
        .info-message a:hover {
            color: #0b2e13;
        }
        
        .test-users-info {
            border: 1px solid #dee2e6;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 5px;
            margin: 10px 0;
            text-align: center;
            border: 1px solid #f5c6cb;
        }
    </style>
</body>
</html>
