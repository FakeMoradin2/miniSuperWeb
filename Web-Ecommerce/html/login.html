<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/styles_login.css">
</head>
<body>
    <div class="container">
        <div class="corner-image" aria-hidden="true">
            <a href="principal.html">
                <img src="../WhatsApp Image 2025-10-12 at 12.46.25_976f73b5.jpg" alt="Imagen de esquina">
            </a> 
        </div>  

        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to your account to continue shopping</p>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="phone">Phone number</label>
                <input type="text" id="phone" name="phone" placeholder="Enter your phone number" required
                       pattern="[0-9]+" title="Please enter only numbers">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>

                <div class="show-password">
                    <input type="checkbox" id="showPassword">
                    <label for="showPassword">Show Password</label>
                </div>
            </div>
            
            <div class="forgot-password">
                <a href="#" id="forgotPassword">Forgot your password?</a>
            </div>
            
            <button type="submit" class="signin-btn" id="loginButton">
                <span class="button-text">Login</span>
                <span class="button-loading" style="display: none;">Loading...</span>
            </button>
            
            <div class="signup">Don't have an account? <a href="signup.html">Sign up</a></div>
            
            <!-- Nuevo campo para empleados -->
            <div class="employee-login">
                <hr class="divider">
                <p class="employee-text">Are you an employee?</p>
                <a href="../../Web_Administracion/login.html" class="employee-link">Go to Admin Login</a>
            </div>
            
        </form>

        <!-- Mensaje de error -->
        <div id="errorMessage" class="error-message" style="display: none;"></div>

    <!-- Incluir el AuthManager -->
    <script src="../jss/api.js"></script>
    <script src="../jss/auth.js"></script>

    <script>
        (function() {

            const form = document.getElementById('loginForm');
            const toggle = document.getElementById('showPassword');
            const pwd = document.getElementById('password');
            const phoneInput = document.getElementById('phone');
            const loginButton = document.getElementById('loginButton');
            const errorMessage = document.getElementById('errorMessage');

            // Función para mostrar mensaje de error
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 5000);
            }

            // Función para mostrar/ocultar loading
            function setLoading(isLoading) {
                const buttonText = loginButton.querySelector('.button-text');
                const buttonLoading = loginButton.querySelector('.button-loading');
                
                if (isLoading) {
                    buttonText.style.display = 'none';
                    buttonLoading.style.display = 'inline';
                    loginButton.disabled = true;
                } else {
                    buttonText.style.display = 'inline';
                    buttonLoading.style.display = 'none';
                    loginButton.disabled = false;
                }
            }

            // Validar que solo se ingresen números en el campo de teléfono
            if (phoneInput) {
                phoneInput.addEventListener('input', function(e) {
                    // Remover cualquier carácter que no sea número
                    this.value = this.value.replace(/[^0-9]/g, '');
                });
                
                phoneInput.addEventListener('keypress', function(e) {
                    // Solo permitir teclas numéricas
                    const charCode = e.which ? e.which : e.keyCode;
                    if (charCode < 48 || charCode > 57) {
                        e.preventDefault();
                        return false;
                    }
                    return true;
                });
            }

            // Toggle para mostrar contraseña
            if (toggle && pwd) {
                toggle.addEventListener('change', function() {
                    pwd.type = this.checked ? 'text' : 'password';
                });
            }

            // Función para determinar el rol basado en el usuario
            function determineUserRole(phoneNumber, registeredUsers) {
                // Buscar en usuarios registrados
                const registeredUser = registeredUsers.find(user => 
                    user.phone === phoneNumber || user.nombre_usuario === phoneNumber
                );
                
                if (registeredUser) {
                    return registeredUser.role;
                }
                
                // Si no está registrado, determinar por el número de teléfono
                // (puedes ajustar esta lógica según tus necesidades)
                const phoneStr = phoneNumber.toString();
                if (phoneStr.includes('999') || phoneStr.startsWith('99')) {
                    return 'admin';
                } else if (phoneStr.includes('888') || phoneStr.startsWith('88')) {
                    return 'cajero';
                } else {
                    return 'cliente';
                }
            }

            // Genera un ID consistente basado en el teléfono
            function generateUserId(phoneNumber) {
                let hash = 0;
                for (let i = 0; i < phoneNumber.length; i++) {
                    const char = phoneNumber.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash = hash & hash; // Convertir a entero de 32 bits
                }
                return Math.abs(hash);
            }
            
            function getUserData(phoneNumber, role, registeredUsers) {
                const registeredUser = registeredUsers.find(user => 
                    user.telefono === phoneNumber || user.nombre_usuario === phoneNumber
                );
                
                // Generar ID consistente basado en el teléfono
                const userId = generateUserId(phoneNumber);
                
                if (registeredUser) {
                    return {
                        id: userId,
                        name: registeredUser.nombre_usuario || registeredUser.name || `User ${phoneNumber}`,
                        username: registeredUser.nombre_usuario || phoneNumber,
                        phone: registeredUser.telefono || phoneNumber,
                        role: role,
                        email: registeredUser.email || `${phoneNumber}@minisuper.com`
                    };
                }
                
                // Usuario no registrado (login básico)
                return {
                    id: userId,
                    name: `User ${phoneNumber}`,
                    username: phoneNumber,
                    phone: phoneNumber,
                    role: role,
                    email: `${phoneNumber}@minisuper.com`
                };
            }

            // Manejo del formulario de login
            if (!form) return;
            
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const phoneNumber = form.phone.value.trim();
                const password = form.password.value;

                // Validaciones básicas
                if (!phoneNumber || !password) {
                    showError('Please complete all fields.');
                    return;
                }

                // Validar que sea solo números
                if (!/^\d+$/.test(phoneNumber)) {
                    showError('Phone number must contain only numbers.');
                    return;
                }

                if (phoneNumber.length < 8) {
                    showError('Phone number must be at least 8 digits.');
                    return;
                }

                if (password.length < 8) {
                    showError('Password must be at least 8 characters.');
                    return;
                }

                try {
                    setLoading(true);
                    
                    console.log('🔐 Attempting login with:', { phoneNumber });
                    
                    // Intentar login con la API primero
                    try {
                        const response = await window.api.auth.login({
                            telefono: phoneNumber,
                            password: password
                        });
                        
                        console.log('📡 API Response:', response);
                        
                        // Verificar si el login fue exitoso (la API puede devolver response.usuario o response.data)
                        if (response.success && (response.usuario || response.data)) {
                            // Login exitoso con API
                            const apiUser = response.usuario || response.data;
                            const userData = {
                                id: apiUser.id || apiUser.Id_usuario || generateUserId(phoneNumber),
                                name: apiUser.nombre_usuario || apiUser.name || `User ${phoneNumber}`,
                                username: apiUser.nombre_usuario || phoneNumber,
                                phone: apiUser.telefono || phoneNumber,
                                role: apiUser.rol || apiUser.role || 'cliente',
                                email: apiUser.email || `${phoneNumber}@minisuper.com`,
                                token: response.token // Guardar el token si existe
                            };
                            
                            // Guardar en localStorage para uso local
                            const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
                            const existingIndex = registeredUsers.findIndex(u => 
                                u.telefono === phoneNumber || u.nombre_usuario === apiUser.nombre_usuario
                            );
                            
                            if (existingIndex === -1) {
                                registeredUsers.push({
                                    nombre_usuario: userData.username,
                                    telefono: userData.phone,
                                    password: password,
                                    rol: userData.role,
                                    email: userData.email
                                });
                                localStorage.setItem('registeredUsers', JSON.stringify(registeredUsers));
                            }
                            
                            // Guardar el token si existe
                            if (userData.token) {
                                localStorage.setItem('authToken', userData.token);
                            }
                            
                            // Usar el AuthManager para el login
                            const loginSuccess = window.authManager.login(userData);
                            
                            if (loginSuccess) {
                                console.log('✅ Login successful via API:', userData);
                                console.log('🎯 Redirecting to role:', userData.role);
                                window.authManager.redirectByRole(userData.role);
                            }
                            return;
                        }
                    } catch (apiError) {
                        console.log('⚠️ API login failed, trying localStorage:', apiError.message);
                    }
                    
                    // Fallback: Verificar en localStorage
                    const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
                    const userExists = registeredUsers.find(user => 
                        (user.telefono === phoneNumber || user.nombre_usuario === phoneNumber) && 
                        user.password === password
                    );

                    if (userExists) {
                        // Determinar el rol del usuario
                        const userRole = userExists.rol || 'cliente';
                        
                        // Obtener datos del usuario
                        const userData = getUserData(phoneNumber, userRole, registeredUsers);
                        
                        // Usar el AuthManager para el login
                        const loginSuccess = window.authManager.login(userData);
                        
                        if (loginSuccess) {
                            console.log('✅ Login successful via localStorage:', userData);
                            window.authManager.redirectByRole(userRole);
                        } else {
                            showError('Error during login process. Please try again.');
                        }
                    } else {
                        showError('Invalid phone number or password. Please try again or sign up.');
                    }
                    
                } catch (error) {
                    console.error('❌ Login error:', error);
                    showError('Login error. Please try again later.');
                } finally {
                    setLoading(false);
                }
            });

            // Olvidó contraseña
            const forgotPassword = document.getElementById('forgotPassword');
            if (forgotPassword) {
                forgotPassword.addEventListener('click', function(e) {
                    e.preventDefault();
                    showError('Password recovery feature coming soon.');
                });
            }

            // Verificar si hay usuarios registrados en localStorage (para testing)
            window.checkRegisteredUsers = function() {
                const users = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
                console.log('📋 Registered users:', users);
                return users;
            };

            // Verificar si ya está autenticado y redirigir
            function checkExistingAuth() {
                if (window.authManager && window.authManager.checkAuthentication()) {
                    const user = window.authManager.getUser();
                    console.log('🔐 User already authenticated:', user);
                    
                    // Mostrar mensaje informativo
                    const alreadyLoggedIn = document.createElement('div');
                    alreadyLoggedIn.className = 'info-message';
                    alreadyLoggedIn.style.cssText = `
                        background: #d4edda;
                        color: #155724;
                        padding: 12px;
                        border-radius: 5px;
                        margin: 10px 0;
                        text-align: center;
                    `;
                    alreadyLoggedIn.innerHTML = `
                        Ya estás autenticado como <strong>${user.name}</strong> (${user.role}). 
                        <br><a href="#" id="continueAsUser">Continuar como ${user.name}</a> | 
                        <a href="#" id="logoutAndLogin">Cerrar sesión y entrar como otro usuario</a>
                    `;
                    
                    form.parentNode.insertBefore(alreadyLoggedIn, form);
                    
                    // Event listeners para los enlaces
                    document.getElementById('continueAsUser').addEventListener('click', function(e) {
                        e.preventDefault();
                        window.authManager.redirectByRole(user.role);
                    });
                    
                    document.getElementById('logoutAndLogin').addEventListener('click', function(e) {
                        e.preventDefault();
                        window.authManager.logout();
                    });
                }
            }

            // Ejecutar verificación de autenticación existente cuando el AuthManager esté listo
            if (window.authManager) {
                setTimeout(checkExistingAuth, 100);
            } else {
                window.addEventListener('load', checkExistingAuth);
            }

            // Para debugging: mostrar usuarios registrados en consola
            console.log('👥 Currently registered users:', window.checkRegisteredUsers());

        })();
    </script>

    <style>
        .info-message a {
            color: #155724;
            text-decoration: underline;
            margin: 0 5px;
        }
        
        .info-message a:hover {
            color: #0b2e13;
        }
        
        .test-users-info {
            border: 1px solid #dee2e6;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 5px;
            margin: 10px 0;
            text-align: center;
            border: 1px solid #f5c6cb;
        }
        
        /* Estilos para la sección de empleado */
        .employee-login {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .divider {
            border: none;
            height: 1px;
            background-color: #ddd;
            margin: 20px 0;
        }
        
        .employee-text {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .employee-link {
            display: inline-block;
            background-color: #f8f9fa;
            color: #6c757d;
            padding: 8px 20px;
            border-radius: 5px;
            text-decoration: none;
            border: 1px solid #dee2e6;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .employee-link:hover {
            background-color: #e9ecef;
            color: #495057;
            text-decoration: none;
            border-color: #ced4da;
        }
        
        /* Estilo para el input de teléfono */
        input[type="tel"] {
            font-family: monospace;
        }
        
        input[type="tel"]::placeholder {
            font-family: inherit;
        }
    </style>
</body>
</html>
