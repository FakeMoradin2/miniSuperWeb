<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account</title>
    <link rel="stylesheet" href="../css/styles_signup.css">
</head>
<body>
    <div class="container">
        <div class="corner-image" aria-hidden="true">
            <a href="principal.html">
                <img src="../WhatsApp Image 2025-10-12 at 12.46.25_976f73b5.jpg" alt="Imagen de esquina">
            </a>
        </div>

        <h1>Create account</h1>
        
        <form id="registerForm">
            <div class="name-row">
                <div class="form-group">
                    <label for="nombre_usuario">Username</label>
                    <input type="text" id="nombre_usuario" name="nombre_usuario" placeholder="Enter your username" required>
                    <div class="error-message" id="usernameError"></div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="telefono">Phone Number</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Enter your contact number" required maxlength="10">
                <div class="error-message" id="phoneError"></div>
            </div>
            
            <div class="form-group">
                <label for="contraseña">Password</label>
                <input type="password" id="contraseña" name="contraseña" placeholder="Create password" required minlength="8">
                <div class="password-requirement">
                    <span id="lengthCheck">❌ At least 8 characters</span>
                </div>

                <div class="show-password">
                    <input type="checkbox" id="showPassword">
                    <label for="showPassword">Show Password</label>
                </div>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm password" required>
                <div class="error-message" id="confirmPasswordError"></div>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">I accept the Terms of Service and Privacy Policy</label>
                <div class="error-message" id="termsError"></div>
            </div>
            
            <button type="submit" class="create-account-btn" id="registerButton">
                <span class="button-text">Create account</span>
                <span class="button-loading" style="display: none;">Creating account...</span>
            </button>
            
            <div class="signin-link">
                Already have an account? <a href="login.html">Login</a>
            </div>
        </form>

        <!-- Mensajes de éxito/error -->
        <div id="successMessage" class="success-message" style="display: none;"></div>
        <div id="errorMessage" class="error-message" style="display: none;"></div>
    </div>
    
    <script src="../jss/api.js"></script>
    <script>
        (function() {
            const form = document.getElementById('registerForm');
            const toggle = document.getElementById('showPassword');
            const passwordInput = document.getElementById('contraseña');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const registerButton = document.getElementById('registerButton');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');

            // Función para mostrar mensajes sin afectar bordes de inputs
            function showMessage(element, message, isError = true) {
                element.textContent = message;
                element.style.display = 'block';
                element.className = isError ? 'error-message' : 'success-message';
                
                if (isError) {
                    setTimeout(() => {
                        element.style.display = 'none';
                    }, 5000);
                }
            }

            // Función para limpiar todos los mensajes de error
            function clearAllErrors() {
                const errorElements = document.querySelectorAll('.error-message');
                errorElements.forEach(element => {
                    element.style.display = 'none';
                    element.textContent = '';
                });
                
                // Limpiar estilos de error de los inputs
                const inputs = document.querySelectorAll('input');
                inputs.forEach(input => {
                    input.style.borderColor = '';
                    input.style.backgroundColor = '';
                    input.classList.remove('error', 'success');
                });
            }

            // Función para mostrar/ocultar loading
            function setLoading(isLoading) {
                const buttonText = registerButton.querySelector('.button-text');
                const buttonLoading = registerButton.querySelector('.button-loading');
                
                if (isLoading) {
                    buttonText.style.display = 'none';
                    buttonLoading.style.display = 'inline';
                    registerButton.disabled = true;
                    registerButton.classList.add('loading');
                } else {
                    buttonText.style.display = 'inline';
                    buttonLoading.style.display = 'none';
                    registerButton.disabled = false;
                    registerButton.classList.remove('loading');
                }
            }

            // Toggle para mostrar contraseña
            if (toggle) {
                toggle.addEventListener('change', function() {
                    const type = this.checked ? 'text' : 'password';
                    if (passwordInput) passwordInput.type = type;
                    if (confirmPasswordInput) confirmPasswordInput.type = type;
                });
            }

            // Validación de contraseña en tiempo real
            if (passwordInput) {
                passwordInput.addEventListener('input', function() {
                    const lengthCheck = document.getElementById('lengthCheck');
                    if (this.value.length >= 8) {
                        lengthCheck.innerHTML = '✅ At least 8 characters';
                        lengthCheck.style.color = 'green';
                        this.style.borderColor = '#10B981';
                        this.style.backgroundColor = '#F0FDF4';
                    } else {
                        lengthCheck.innerHTML = '❌ At least 8 characters';
                        lengthCheck.style.color = 'red';
                        this.style.borderColor = '';
                        this.style.backgroundColor = '';
                    }
                });
            }

            // Validación de confirmación de contraseña
            if (confirmPasswordInput) {
                confirmPasswordInput.addEventListener('input', function() {
                    const password = passwordInput.value;
                    const confirmPassword = this.value;
                    const errorElement = document.getElementById('confirmPasswordError');
                    
                    if (confirmPassword && password !== confirmPassword) {
                        showMessage(errorElement, 'Passwords do not match');
                        this.style.borderColor = '#DC2626';
                        this.style.backgroundColor = '#FEF2F2';
                    } else {
                        errorElement.style.display = 'none';
                        this.style.borderColor = password ? '#10B981' : '';
                        this.style.backgroundColor = password ? '#F0FDF4' : '';
                    }
                });
            }

            // Validación de teléfono
            const phoneInput = document.getElementById('telefono');
            if (phoneInput) {
                phoneInput.addEventListener('input', function() {
                    // Solo permitir números
                    this.value = this.value.replace(/\D/g, '');
                    
                    // Validar longitud
                    const errorElement = document.getElementById('phoneError');
                    if (this.value.length > 0 && this.value.length !== 10) {
                        showMessage(errorElement, 'Phone number must be 10 digits');
                        this.style.borderColor = '#DC2626';
                        this.style.backgroundColor = '#FEF2F2';
                    } else {
                        errorElement.style.display = 'none';
                        this.style.borderColor = this.value.length === 10 ? '#10B981' : '';
                        this.style.backgroundColor = this.value.length === 10 ? '#F0FDF4' : '';
                    }
                });
            }

            // Validación de username
            const usernameInput = document.getElementById('nombre_usuario');
            if (usernameInput) {
                usernameInput.addEventListener('input', function() {
                    const errorElement = document.getElementById('usernameError');
                    errorElement.style.display = 'none';
                    this.style.borderColor = this.value.length >= 3 ? '#10B981' : '';
                    this.style.backgroundColor = this.value.length >= 3 ? '#F0FDF4' : '';
                });
            }

            // Manejo del formulario de registro
            if (!form) return;
            
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                // Limpiar todos los errores previos
                clearAllErrors();
                
                // Obtener valores del formulario
                const nombre_usuario = form.nombre_usuario.value.trim();
                const telefono = form.telefono.value.trim();
                const contraseña = form.contraseña.value;
                const confirmPassword = confirmPasswordInput.value;
                const termsAccepted = document.getElementById('terms').checked;

                // Validaciones del frontend
                const errors = validateForm(nombre_usuario, telefono, contraseña, confirmPassword, termsAccepted);
                
                if (errors.length > 0) {
                    showMessage(errorMessage, errors.join('\n'));
                    return;
                }

                try {
                    setLoading(true);
                    
                    // Preparar datos para enviar a la API
                    const userData = {
                        nombre_usuario: nombre_usuario,
                        telefono: telefono,
                        password: contraseña,
                        rol: 'cliente' // Por defecto para registros desde ecommerce
                    };

                    console.log('📝 Attempting registration with:', { 
                        nombre_usuario: nombre_usuario,
                        telefono: telefono,
                        rol: 'cliente'
                    });
                    
                    // Llamar a la API de registro
                    const response = await window.api.auth.register(userData);
                    
                    console.log('✅ Registration response:', response);
                    
                    if (response.success) {
                        showMessage(successMessage, 'Account created successfully! Redirecting to login...', false);
                        
                        // Redirigir al login después de 2 segundos
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 2000);
                        
                    } else {
                        // Manejar errores específicos del backend
                        let errorMsg = response.message || 'Registration failed. Please try again.';
                        
                        if (response.message && response.message.includes('username')) {
                            showMessage(document.getElementById('usernameError'), 'Username already exists');
                            usernameInput.style.borderColor = '#DC2626';
                            usernameInput.style.backgroundColor = '#FEF2F2';
                        } else {
                            showMessage(errorMessage, errorMsg);
                        }
                    }
                    
                } catch (error) {
                    console.error('❌ Registration error:', error);
                    showMessage(errorMessage, 'Registration error: ' + (error.message || 'Please try again later.'));
                } finally {
                    setLoading(false);
                }
            });

            // Funciones de validación
            function validateForm(username, phone, password, confirmPassword, termsAccepted) {
                const errors = [];

                if (!username || username.length < 3) {
                    errors.push('Username must be at least 3 characters long');
                    usernameInput.style.borderColor = '#DC2626';
                    usernameInput.style.backgroundColor = '#FEF2F2';
                }

                if (!phone || phone.length !== 10) {
                    errors.push('Phone number must be exactly 10 digits');
                    phoneInput.style.borderColor = '#DC2626';
                    phoneInput.style.backgroundColor = '#FEF2F2';
                }

                if (!password || password.length < 8) {
                    errors.push('Password must be at least 8 characters long');
                    passwordInput.style.borderColor = '#DC2626';
                    passwordInput.style.backgroundColor = '#FEF2F2';
                }

                if (password !== confirmPassword) {
                    errors.push('Passwords do not match');
                    confirmPasswordInput.style.borderColor = '#DC2626';
                    confirmPasswordInput.style.backgroundColor = '#FEF2F2';
                }

                if (!termsAccepted) {
                    errors.push('You must accept the Terms of Service and Privacy Policy');
                }

                return errors;
            }

            // Inicializar: limpiar todos los errores al cargar la página
            clearAllErrors();

        })();
    </script>
</body>
</html>
