<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minisuper Market</title>
    <link rel="stylesheet" href="../css/styles_principal.css">
    <link rel="stylesheet" href="../css/styles_pages.css">
</head>
<body>
    <nav class="navbar">   
        <div class="main-nav">
            <a href="index.html" class="corner-image">
                <img class="corner-image" src="../iconmini.png" alt="Logo Minisuper Market">
                <span>Minisuper Market</span>
            </a>  
            
            <div class="search-container">
                <form class="search-form" action="#" method="get">
                    <input type="search" class="search-input" placeholder="Buscar productos...">
                    <button type="submit" class="search-button">🔍</button>
                </form>
            </div>

            <div class="nav-links">
                <a href="#" class="nav-link">My Account</a>
                <a href="#" class="nav-link">My Orders</a>
                <a href="cart.html" class="nav-link">
                    <span class="cart-icon">🛒</span>
                    Cart
                    <span id="cartCount" class="cart-count">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="categories">
        <div class="categories-container">
            <a href="#" class="category-link active" data-category="All Products">All Products</a>
            <a href="#" class="category-link" data-category="Daily Deals">Daily Deals</a>
            <a href="#" class="category-link" data-category="Groceries">Groceries</a>
            <a href="#" class="category-link" data-category="Dairy & Eggs">Dairy & Eggs</a>
            <a href="#" class="category-link" data-category="Fruits & Vegetables">Fruits & Vegetables</a>
            <a href="#" class="category-link" data-category="Meat & Seafood">Meat & Seafood</a>
            <a href="#" class="category-link" data-category="Home Cleaning">Home Cleaning</a>
            <a href="#" class="category-link" data-category="Personal Care">Personal Care</a>
        </div>
    </div>

    <div id="activeFilters" class="active-filters" style="display: none;"></div>

<section class="featured-products">
    <div class="container">
        <div class="section-header">
            <h2 class="section-title">Featured Products</h2>
            <div class="sorting-controls">
                <label for="sortOrder">Ordenar por:</label>
                <select id="sortOrder" class="sort-select">
                    <option value="default">Por defecto</option>
                    <option value="asc">Nombre A-Z</option>
                    <option value="desc">Nombre Z-A</option>
                </select>
                <label for="itemsPerPage">Productos por página:</label>
                <select id="itemsPerPage" class="sort-select">
                    <option value="4">4</option>
                    <option value="8" selected>8</option>
                    <option value="12">12</option>
                    <option value="16">16</option>
                    <option value="24">24</option>
                </select>
            </div>
        </div>
        
        <div id="searchResultsInfo" class="search-results-info" style="display: none;"></div>
        
        <div class="products-grid" id="productsGrid">
            <!-- Products will be loaded here with pagination -->
        </div>
        
        <div id="paginationContainer"></div>
    </div>
</section>

<section class="special-offers">
    <div class="container">
        <h2 class="section-title">Special Offers</h2>
        <div class="offers-grid" id="offersGrid">
            <!-- Offers will be loaded here -->
        </div>
    </div>
</section>

<footer>
    <p>&copy; 2025 Minisuper Market - All rights reserved</p>
</footer>

<script src="../jss/script_pages.js"></script>
<script src="../jss/script_products.js"></script>

<script>
    // Este script se ejecuta después de que script_products.js ya inicializó todo
    // Solo configura funciones adicionales si es necesario
</script>
</body>
</html>
