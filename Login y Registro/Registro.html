<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account</title>
    <link rel="stylesheet" href="styles_Registro.css">
</head>
<body>
    <div class="container">
        <!-- recuadro de imagen en la esquina -->
        <div class="corner-image" aria-hidden="true">
            <a href="Principal.html">
                <img src="WhatsApp Image 2025-10-12 at 12.46.25_976f73b5.jpg" alt="Imagen de esquina">
            </a>
        </div>

        <h1>Create account</h1>
        
        <form id="registerForm">
            <div class="name-row">
                <div class="form-group">
                    <label for="firstName">Name</label>
                    <input type="text" id="firstName" value="" placeholder="Enter your name" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" value="" placeholder="Enter your contact number" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create password" required>
                <div class="password-requirement">
                    <span>✔ At least 8 characters</span>
                </div>

                <!-- Recuadro para mostrar contraseña -->
                <div class="show-password">
                    <input type="checkbox" id="showPassword">
                    <label for="showPassword">Show Password</label>
                </div>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm password" required>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">I accept the Terms of Service and Privacy Policy</label>
            </div>
            
            <button type="submit" class="create-account-btn">Create account</button>
            
            <div class="signin-link">
                Already have an account? <a href="Login.html">Login</a>
            </div>
        </form>
    </div>
    
    <!--visibilidad de la contraseña -->
    <script>
        (function() {
            const toggle = document.getElementById('showPassword');
            if (!toggle) return;
            toggle.addEventListener('change', function() {
                const type = this.checked ? 'text' : 'password';
                const pwd = document.getElementById('password');
                const confirm = document.getElementById('confirmPassword');
                if (pwd) pwd.type = type;
                if (confirm) confirm.type = type;
            });
        })();
    </script>
</body>
</html>
