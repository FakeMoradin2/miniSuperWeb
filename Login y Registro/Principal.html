<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minisuper Market</title>
    <link rel="stylesheet" href="styles_Principal.css">
    <link rel="stylesheet" href="styles_pages.css">
</head>
<body>
    <nav class="navbar">   
        <div class="main-nav">

            <a href="index.html" class="corner-image">
                <img class="corner-image" src="iconmini.png" alt="Logo Minisuper Market">
                <span>Minisuper Market</span>
            </a>  
            
            <div class="search-container">
                <form class="search-form" action="#" method="get">
                    <input type="search" class="search-input" placeholder="Buscar productos...">
                    <button type="submit" class="search-button">🔍</button>
                </form>
            </div>

            <!-- Enlaces de navegación -->
            <div class="nav-links">
                <a href="#" class="nav-link">My Account</a>
                <a href="#" class="nav-link">My Orders</a>
                <a href="Carrito.html" class="nav-link">
                    <span class="cart-icon">🛒</span>
                    Cart
                    <span id="cartCount" class="cart-count">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="categories">
        <div class="categories-container">
            <a href="#" class="category-link active">All Products</a>
            <a href="#" class="category-link">Daily Deals</a>
            <a href="#" class="category-link">Groceries</a>
            <a href="#" class="category-link">Dairy & Eggs</a>
            <a href="#" class="category-link">Fruits & Vegetables</a>
            <a href="#" class="category-link">Meat & Seafood</a>
            <a href="#" class="category-link">Home Cleaning</a>
            <a href="#" class="category-link">Personal Care</a>
        </div>
    </div>

<section class="featured-products">
    <div class="container">
        <h2 class="section-title">Featured Products</h2>
        <div class="products-grid" id="productsGrid">
            <!-- Los productos se cargarán aquí con paginación -->
        </div>
        
        <!-- Contenedor de las paginas -->
        <div id="paginationContainer"></div>
    </div>
</section>

<section class="special-offers">
    <div class="container">
        <h2 class="section-title">Special Offers</h2>
        <div class="offers-grid" id="offersGrid">
            <!-- Las ofertas se cargarán aquí (sin paginación) -->
        </div>
    </div>
</section>

<footer>
    <p>&copy; 2025 Minisuper Market - All rights reserved</p>
</footer>

<script src="script_Productos.js"></script>
<script src="script_pages.js"></script>

<script>
    // Inicialización cuando se carga la página
    document.addEventListener('DOMContentLoaded', function() {
        // Inicializar paginación con productos destacados
        inicializarPaginacion(productos, 8);
        cambiarPagina(1);
        
        // Ocultar sección de ofertas especiales
        document.querySelector('.special-offers').style.display = 'none';
        
        // Actualizar contador del carrito
        const carritoActual = JSON.parse(localStorage.getItem('carrito') || '{"items": [], "contadorItems": 0}');
        const cartCountElement = document.getElementById('cartCount');
        if (cartCountElement) {
            cartCountElement.textContent = carritoActual.contadorItems || 0;
        }
    });
</script>
</body>
</html>
