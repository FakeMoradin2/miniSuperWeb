<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reportes - Minisúper</title>
  <link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body>
  <div class="sidebar">
  <div class="header">
    <i class="fas fa-store"></i>
    <h2 style="margin-left:6px">Minisuper System</h2>
</div>
    <ul>
      <script>
      if (window.location.pathname.includes('dashboard.html')) {
        if (!window.authManager.hasRole('admin')) {
            window.authManager.redirectToUnauthorized();
        }
    }</script>
      <li><a href="dashboard.html" class="active"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a></li>
      <li><a href="pos.html"><i class="fas fa-cash-register"></i><span>Punto de Venta</span></a></li>
      <li><a href="inventory.html"><i class="fas fa-boxes"></i><span>Inventario</span></a></li>
      <li><a href="reports.html"><i class="fas fa-chart-bar"></i><span>Reportes</span></a></li>
      <li><a href="customers.html"><i class="fas fa-users"></i><span>Clientes</span></a></li>
      <li><a href="proveedores.html"><i class="fas fa-truck"></i><span>Proveedores</span></a></li>
      <li><a href="categoria.html"><i class="fas fa-tags"></i><span>Categorías</span></a></li>
      <li><a href="signup_workers.html"><i class="fas fa-user-tie"></i><span>Empleados</span></a></li>
    </ul>
  </div>

  <div class="main">
    <div class="header-top"><h1>Reportes</h1><div class="user"><div class="avatar">JD</div></div></div>

    <div class="form-card">
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <div><label>Inicio</label><input type="date" id="fechaInicio"></div>
        <div><label>Fin</label><input type="date" id="fechaFin"></div>
        <div style="align-self:end"><button id="btnVerReporte" class="btn primary">Ver reporte</button></div>
      </div>
    </div>

    <div class="table-card">
      <h3>Totales</h3>
      <div id="resumenTotales">Cargando...</div>
    </div>

    <div class="table-card">
      <h3>Historial de Ventas</h3>
      <table id="ventasTable">
        <thead>
          <tr>
            <th>Folio</th>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Método Pago</th>
            <th>Total</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
