<!-- frontend/pos.html -->
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Punto de Venta - Minisúper</title>
  <link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body>
  <div class="sidebar">
  <div class="header">
    <i class="fas fa-store"></i>
    <h2 style="margin-left:6px">Minisuper System</h2>
</div>
    <ul>
      <script>
      if (window.location.pathname.includes('dashboard.html')) {
        if (!window.authManager.hasRole('admin')) {
            window.authManager.redirectToUnauthorized();
        }
    }</script>
      <li><a href="dashboard.html" class="active"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a></li>
      <li><a href="pos.html"><i class="fas fa-cash-register"></i><span>Punto de Venta</span></a></li>
      <li><a href="inventory.html"><i class="fas fa-boxes"></i><span>Inventario</span></a></li>
      <li><a href="reports.html"><i class="fas fa-chart-bar"></i><span>Reportes</span></a></li>
      <li><a href="customers.html"><i class="fas fa-users"></i><span>Clientes</span></a></li>
      <li><a href="proveedores.html"><i class="fas fa-truck"></i><span>Proveedores</span></a></li>
      <li><a href="categoria.html"><i class="fas fa-tags"></i><span>Categorías</span></a></li>
      <li><a href="signup_workers.html"><i class="fas fa-user-tie"></i><span>Empleados</span></a></li>
    </ul>
  </div>

  <div class="main">
    <div class="header-top">
      <h1>Punto de Venta</h1>
      <div class="user"><div class="avatar">JD</div><div><div style="font-weight:700">Juan Delgado</div><div style="color:var(--gray)">Cajero</div></div></div>
    </div>

    <div style="display:flex;gap:18px;flex-wrap:wrap">
      <div style="flex:1;min-width:320px">
        <div class="form-card">
          <div class="form-group">
            <label>Buscar producto (nombre o código)</label>
            <input id="searchInput" placeholder="Ej: leche">
          </div>
          <div class="form-group" style="display:flex;gap:8px;">
            <button id="btnSearch" class="btn primary">Buscar</button>
            <button id="btnClearSearch" class="btn secondary">Limpiar</button>
          </div>
          <div id="searchResults"></div>
        </div>

        <div class="form-card">
          <h3>Cliente</h3>
          <div class="form-group"><label>Cliente (opcional)</label><input id="clienteInput" placeholder="Nombre del cliente"></div>
          <div class="form-group"><label>Método de pago</label>
            <select id="metodoPago">
              <option value="Efectivo">Efectivo</option>
              <option value="Tarjeta">Tarjeta</option>
            </select>
          </div>
        </div>
      </div>

      <div style="width:520px;max-width:100%">
        <div class="table-card">
          <h3>Carrito</h3>
          <table id="cartTable">
            <thead><tr><th>Producto</th><th>Precio</th><th>Cant</th><th>Subtotal</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
          <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center">
            <div><strong>Total:</strong> <span id="cartTotal">$0.00</span></div>
            <div>
              <button id="btnConfirm" class="btn success">Confirmar Venta</button>
              <button id="btnCancel" class="btn danger">Cancelar</button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pos.js"></script>
  <!-- Modal Recibo -->
  <div id="receiptModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:10px;max-width:520px;width:92%;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.25)">
      <h3 style="margin-top:0">Recibo de compra</h3>
      <div id="receiptContent" style="max-height:55vh;overflow:auto;border:1px solid var(--border-color);border-radius:8px;padding:12px;background:#fafafa"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
        <button id="btnOpenReports" class="btn secondary">Ver en Reportes</button>
        <button id="btnPrintReceipt" class="btn secondary">Imprimir</button>
        <button id="btnCloseReceipt" class="btn">Cerrar</button>
      </div>
    </div>
  </div>
  <script>
    // Inicializar cuando el DOM esté listo
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
