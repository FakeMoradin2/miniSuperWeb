<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Categorías - Minisúper</title>
  <link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body>
  <div class="sidebar">
    <div class="header">
      <i class="fas fa-store"></i>
      <h2 style="margin-left:6px">Minisuper System</h2>
</div>
    <ul>
      <script>
      if (window.location.pathname.includes('dashboard.html')) {
        if (!window.authManager.hasRole('admin')) {
            window.authManager.redirectToUnauthorized();
        }
    }</script>
      <li><a href="dashboard.html" class="active"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a></li>
      <li><a href="pos.html"><i class="fas fa-cash-register"></i><span>Punto de Venta</span></a></li>
      <li><a href="inventory.html"><i class="fas fa-boxes"></i><span>Inventario</span></a></li>
      <li><a href="reports.html"><i class="fas fa-chart-bar"></i><span>Reportes</span></a></li>
      <li><a href="customers.html"><i class="fas fa-users"></i><span>Clientes</span></a></li>
      <li><a href="proveedores.html"><i class="fas fa-truck"></i><span>Proveedores</span></a></li>
      <li><a href="categoria.html"><i class="fas fa-tags"></i><span>Categorías</span></a></li>
      <li><a href="signup_workers.html"><i class="fas fa-user-tie"></i><span>Empleados</span></a></li>
    </ul>
  </div>

  <div class="main">
    <div class="header-top">
      <h1>Categorías</h1>
      <div class="user">
        <div class="avatar">JD</div>
      </div>
    </div>

    <!-- Formulario para agregar categoría -->
    <div class="form-card">
      <h3>Agregar Categoría</h3>
      <div class="form-group">
        <label>Nombre de la Categoría</label>
        <input id="nombreCategoria" type="text">
      </div>
      <div>
        <button id="btnAddCategoria" class="btn primary">Registrar Categoría</button>
      </div>
    </div>

    <!-- Tabla de categorías -->
    <div class="table-card">
      <h3>Categorías Registradas</h3>
      <table id="categoriasTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <!-- Modal para editar categoría -->
  <div id="editCategoriaModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h3>Editar Categoría</h3>
      <div class="form-group">
        <label>Nombre de la Categoría</label>
        <input type="text" id="editNombreCategoria">
      </div>
      <div class="form-group">
        <label>Estado</label>
        <select id="editEstadoCategoria">
          <option value="true">Activo</option>
          <option value="false">Inactivo</option>
        </select>
      </div>
      <div>
        <button id="btnUpdateCategoria" class="btn primary">Actualizar Categoría</button>
      </div>
    </div>
  </div>
</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/categoria.js"></script>
</body>
</html>
