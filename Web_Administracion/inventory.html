  <style>
    .product-image {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      display: block;
    }
    
    .image-preview {
      max-width: 100px;
      max-height: 100px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }
    
    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
    }
    
    .status-active {
      background: #d4edda;
      color: #155724;
    }
    
    .status-inactive {
      background: #f8d7da;
      color: #721c24;
    }
    
    #productosTable tbody tr:hover {
      background-color: #f8f9fa;
    }
  </style>
</head>

  <div class="main">
    <div class="header-top">
      <h1>Inventario de Productos</h1>
      <div class="user">
        <div class="avatar">JD</div>
      </div>
    </div>

    <div style="display:flex;gap:18px;flex-wrap:wrap">
      <!-- Formulario para agregar/editar producto -->
      <div style="flex:1;min-width:320px">
        <div class="form-card">
          <h3 id="formTitle">Agregar Nuevo Producto</h3>
          <input type="hidden" id="prodId">
          
          <div class="form-group">
            <label>Nombre del Producto *</label>
            <input id="prodNombre" type="text" placeholder="Ej: Refresco Coca-Cola 600ml">
          </div>
          
          <div class="form-group">
            <label>Precio *</label>
            <input id="prodPrecio" type="number" step="0.01" min="0" placeholder="0.00">
          </div>
          
          <div class="form-group">
            <label>Stock *</label>
            <input id="prodStock" type="number" min="0" placeholder="0">
          </div>
          
          <div class="form-group">
            <label>Categoría *</label>
            <select id="prodCategoria">
              <option value="">Seleccionar categoría...</option>
            </select>
          </div>
          
          <div class="form-group">
            <label>Proveedor</label>
            <select id="prodProveedor">
              <option value="">Seleccionar proveedor...</option>
            </select>
          </div>
          
          <div class="form-group">
            <label>URL de Imagen</label>
            <input id="prodImagen" type="url" placeholder="https://ejemplo.com/imagen.jpg">
            <div id="imagePreview" class="image-preview" style="display:none;"></div>
          </div>
          
          <div class="form-group">
            <label>Estado</label>
            <select id="prodActivo">
              <option value="true">Activo</option>
              <option value="false">Inactivo</option>
            </select>
          </div>
          
          <div style="display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;">
            <button id="btnSaveProd" class="btn primary">Guardar Producto</button>
            <button id="btnReset" class="btn secondary">Limpiar</button>
            <button id="btnCancelEdit" class="btn" style="display:none;">Cancelar</button>
          </div>
        </div>
      </div>

      <!-- Lista de productos -->
      <div style="flex:2;min-width:320px">
        <div class="table-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
            <h3>Lista de Productos</h3>
            <div style="display:flex;gap:10px;align-items:center;">
              <select id="filterCategoria" style="padding:6px;border:1px solid #ddd;border-radius:4px;">
                <option value="">Todas las categorías</option>
              </select>
              <select id="filterEstado" style="padding:6px;border:1px solid #ddd;border-radius:4px;">
                <option value="">Todos los estados</option>
                <option value="true">Activos</option>
                <option value="false">Inactivos</option>
              </select>
            </div>
          </div>
          
          <div style="margin-bottom:15px">
            <input type="text" id="searchInput" placeholder="Buscar productos por nombre..." style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;font-size:14px">
          </div>
          
          <div style="overflow-x:auto;">
            <table id="productosTable">
              <thead>
                <tr>
                  <th>Imagen</th>
                  <th>Producto</th>
                  <th>Precio</th>
                  <th>Stock</th>
                  <th>Categoría</th>
                  <th>Estado</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          
          <div id="loadingMessage" style="text-align:center;padding:20px;color:#666;">
            Cargando productos...
          </div>
          
          <div id="noProductsMessage" style="text-align:center;padding:20px;color:#666;display:none;">
            No se encontraron productos
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/inventory.js"></script>
</body>
</html>
